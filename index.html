<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/app.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="status-bar">
        <div class="status-left">
            <span class="time">9:41</span>
        </div>
    </div>

    <div class="status-right">
        <!--Signal-->
        <svg width="18" height="12" viewBox="0 0 24 24">
            <path d="M2 20h2v-4H2v4zm4 0h2v-7H6v7zm4 0h2v-10h-2v10zm4 0h2v-13h-2v13zm4 0h2v-16h-2v16z" />
        </svg>

        <!-- Wifi -->
        <svg width="18" height="12" viewBox="0 0 24 24">
            <path d="M12 20l3.5-3.5a5 5 0 00-7 0L12 20zm0-4l6-6a9 9 0 00-12 0l6 6zm0-4l8-8a13 13 0 00-16 0l8 8z" />
        </svg>

        <!-- Battery -->
        <svg width="28" height="12" viewBox="0 0 30 12">
            <rect x="1" y="1" width="24" height="10" rx="2" ry="2" />
            <rect x="26" y="4" width="3" height="4" />
        </svg>


    </div>




    <!-- header-->
    <header class="topbar">
        <h1 class="title">MyMovie</h1>

        <label class="toggleSwitch">
            <input type="checkbox" id="themeToggle" />
            <div class="toggleSwitch__base">
                <div class="toggleSwitch__toggle"></div>
            </div>
        </label>
    </header>

    <!-- <div class="nowShowing">
        <img src="img/war-machine.webp" alt="war-machine">
    </div> -->

    <!-- Now Showing-->
    <section class="section">
        <div class="section-head">
            <h2>Now Showing</h2>
            <button class="See More">See More</button>
        </div>

        <div id="nowShowing" class="poster-row"></div>

    </section>

    <!-- POPULER-->
    <section class="section">
        <div class="section-head">
            <h2>Populer</h2>
            <button class="see-more">See More</button>
        </div>

    </section>

    <div id="PapulerMovies"></div>
</body>

</html>
